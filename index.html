<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ArchiForge 3D v0.3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand"><span class="logo">AF</span><div><b>ArchiForge</b><small>3D Studio</small></div></div>
  <div class="top-actions">
    <button id="new" title="Новый проект">＋</button>
    <button id="undo" title="Отменить">↶</button>
    <button id="redo" title="Повторить">↷</button>
    <button id="save" title="Сохранить">💾</button>
    <button id="png" title="PNG">▣</button>
    <select id="language" aria-label="Language"><option value="ru">Русский</option><option value="tg">Тоҷикӣ</option></select>
  </div>
</header>

<div class="workspace">
  <aside class="leftbar">
    <button class="tool active" data-tool="select"><span>↖</span><small data-i18n="select">Выбор</small></button>
    <button class="tool" data-tool="wall"><span>╱</span><small data-i18n="wall">Стена</small></button>
    <button class="tool" data-tool="room"><span>□</span><small data-i18n="room">Комната</small></button>
    <button class="tool" data-tool="measure"><span>⌁</span><small data-i18n="measure">Размер</small></button>
    <button class="tool" data-tool="pan"><span>✋</span><small data-i18n="pan">Панорама</small></button>
    <div class="tool-sep"></div>
    <button id="deleteTool" class="tool danger"><span>⌫</span><small data-i18n="delete">Удалить</small></button>
  </aside>

  <main id="viewport">
    <div class="hint" id="wallHint">🧱 <b>Стена:</b> нажмите первую точку, затем вторую. Shift — строго по горизонтали/вертикали.</div>
    <div class="status"><span>X <b id="cx">0.00</b></span><span>Y <b id="cy">0.00</b></span><span>Z <b id="cz">0.00</b></span></div>
    <div class="camera-actions">
      <button id="home">⌂</button><button id="top">TOP</button>
    </div>
  </main>

  <aside class="properties">
    <div class="panel-title"><span data-i18n="properties">Свойства</span><button id="close">×</button></div>
    <div id="empty" class="empty"><div class="empty-icon">◇</div><b data-i18n="nothing">Ничего не выбрано</b><p data-i18n="choose">Выберите объект в сцене.</p></div>
    <div id="content" hidden>
      <div class="object-name"><span id="oname">Wall 1</span><small id="otype">Wall</small></div>
      <label>Position</label>
      <div class="grid3"><input id="px" type="number" step=".1"><input id="py" type="number" step=".1"><input id="pz" type="number" step=".1"></div>
      <label>Size</label>
      <div class="grid3"><input id="sx" type="number" step=".1"><input id="sy" type="number" step=".1"><input id="sz" type="number" step=".1"></div>
      <div id="wallprops" hidden>
        <label data-i18n="thickness">Толщина</label><input id="thick" type="number" step=".05" min=".05">
        <div class="metric"><span data-i18n="length">Длина</span><b id="length">0 m</b></div>
      </div>
      <label data-i18n="material">Материал</label>
      <select id="mat"><option>Concrete</option><option>Brick</option><option>Glass</option><option>Wood</option><option>Steel</option></select>
      <button id="del" class="wide danger-btn" data-i18n="deleteObject">Удалить объект</button>
    </div>
  </aside>
</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
